server.port=8090
spring.application.name=event-microservice
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.url=jdbc:mysql://localhost:3306/event_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
app.jwt.secret=CHANGE_ME_CHANGE_ME_CHANGE_ME_123456789012345678901234567890
app.jwt.expiration-ms=86400000
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.compression.response.enabled=true
feign.compression.request.enabled=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads
spring.web.resources.add-mappings=true
logging.level.com.esprit.microservice.events=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG
ml.sentiment.api.url=http://localhost:8005
ml.recommendation.api.url=http://localhost:5000
