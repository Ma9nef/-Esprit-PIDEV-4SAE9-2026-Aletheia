spring.application.name=ApiGateway
server.port=8089

# Config Server
spring.config.import=optional:configserver:http://config-server:9999

# Eureka
eureka.client.service-url.defaultZone=http://eureka:8761/eureka
eureka.instance.hostname=api-gateway
eureka.instance.prefer-ip-address=true

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=WARN

# Gateway Discovery
spring.cloud.gateway.discovery.locator.enabled=false

# Allow large uploads
spring.codec.max-in-memory-size=50MB

# =========================================================
# ROUTES
# =========================================================

# User Service (8080)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/admin/users/**

# Courses Service (8081)
spring.cloud.gateway.routes[1].id=courses-service
spring.cloud.gateway.routes[1].uri=http://courses:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses/**,/api/lessons/**,/api/enrollments/**,/api/certificates/**,/api/instructor/**,/api/admin/**,/course/**,/api/formations/**

# Library Service (8082)
spring.cloud.gateway.routes[2].id=library-service
spring.cloud.gateway.routes[2].uri=http://library:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/products/**,/api/cart/**,/api/orders/**,/api/receipts/**,/api/stock-movements/**,/api/loans/**,/api/files/**,/api/borrowing-policies/**,/api/analytics/**

# Events Service (8090)
spring.cloud.gateway.routes[3].id=events-service
spring.cloud.gateway.routes[3].uri=http://events-service:8090
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/events/**,/api/allocations/**,/api/resources/**,/room/**,/ws/**

# Offer Service (8086)
spring.cloud.gateway.routes[4].id=offer-service
spring.cloud.gateway.routes[4].uri=http://offer-service:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/offers/**,/api/coupons/**,/api/flash-sales/**,/api/subscriptions/**,/api/subscription-plans/**,/api/offer-analytics/**

# Resource Management Service (8094)
spring.cloud.gateway.routes[5].id=resource-management-service
spring.cloud.gateway.routes[5].uri=http://resource-management-service:8094
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/rm/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/rm/(?<segment>.*), /api/$\{segment}

# =========================================================
# GLOBAL CORS CONFIGURATION
# =========================================================

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://192.168.49.2:30080,http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
# ===============================
# ACTUATOR / PROMETHEUS
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true