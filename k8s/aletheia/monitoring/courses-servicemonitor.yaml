apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: courses-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: courses
  namespaceSelector:
    matchNames:
      - aletheia
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s